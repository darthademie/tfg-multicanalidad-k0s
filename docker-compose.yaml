
services:
  # 1. Clúster de Kubernetes (k0s)
  k0s:
    image: docker.io/k0sproject/k0s:latest
    container_name: k0s-cluster
    hostname: k0s
    privileged: true
    cgroup: host
    command: k0s controller --single
    ports:
      - "6443:6443"   # API de Kubernetes
      - "80:30080"    # Entrada HTTP hacia Ingress-NGINX
      - "443:30443"   # Entrada HTTPS hacia Ingress-NGINX
    volumes:
      - k0s_data:/var/lib/k0s
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    restart: unless-stopped

  # 2. Servidor de Integración Continua (Jenkins)
  jenkins:
    image: docker.io/jenkins/jenkins:lts-jdk17
    container_name: jenkins-local
    user: root
    privileged: true
    ports:
      - "8080:8080"   # Interfaz web de Jenkins (http://localhost:8080)
      - "50000:50000" # Puerto para agentes
    volumes:
      - jenkins_home:/var/jenkins_home
      # Conectamos el socket de Podman como si fuera el de Docker:
      - /run/podman/podman.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  k0s_data:
  jenkins_home: