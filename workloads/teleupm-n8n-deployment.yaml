apiVersion: v1
kind: PersistentVolume
metadata:
  name: teleupm-n8n-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: /var/n8n-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teleupm-n8n-data-pvc
  namespace: apps
spec:
  volumeName: teleupm-n8n-pv
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teleupm-n8n-deployment
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      # Da permisos de escritura al usuario 'node' sobre el disco montado
      securityContext:
        fsGroup: 1000
      # --- Cambia los permisos de la carpeta antes de arrancar n8n ---
      initContainers:
        - name: fix-permissions
          image: busybox
          command: ["sh", "-c", "chown -R 1000:1000 /home/node/.n8n"]
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
      containers:
        - name: n8n-container
          image: n8nio/n8n:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5678
          env:
            # Le decimos a n8n que su frontend debe cargar bajo /flujos/
            - name: N8N_PATH
              value: "/flujos/"
            # Vital para que las URLs de los webhooks que generes tengan tu dominio real
            - name: WEBHOOK_URL
              value: "https://teleupm.com/flujos/"
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: teleupm-n8n-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: teleupm-n8n-svc
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: n8n
  ports:
    - port: 5678
      targetPort: 5678