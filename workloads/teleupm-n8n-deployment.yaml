apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-deployment
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      # Da permisos de escritura al usuario 'node' sobre el disco montado
      securityContext:
        fsGroup: 1000
      containers:
        - name: n8n-container
          image: n8nio/n8n:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5678
          env:
            # Le decimos a n8n que su frontend debe cargar bajo /flujos/
            - name: N8N_PATH
              value: "/flujos/"
            # Vital para que las URLs de los webhooks que generes tengan tu dominio real
            - name: WEBHOOK_URL
              value: "https://teleupm.com/flujos/"
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-svc
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: n8n
  ports:
    - port: 5678
      targetPort: 5678